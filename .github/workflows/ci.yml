name: CI
on:
  pull_request:
  workflow_call:      # deploy.yml 이 이 CI를 먼저 실행하도록 호출할 수 있게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24        # 서버(v24.19.0)와 맞춤
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run build
